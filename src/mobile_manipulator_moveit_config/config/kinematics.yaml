# kinematics.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 5 — IK solver configuration, one entry per planning group that needs IK.
#
# Only KDL/LMA solvers ship with ros-humble-moveit-kinematics on this machine
# (no trac_ik / pick_ik / ur_kinematics package available), so the Setup
# Assistant default — KDLKinematicsPlugin — is used for the arm.  The UR5 has a
# spherical wrist, so KDL's Newton solver converges reliably; the timeout is
# raised from the 0.005 s default because RViz interactive-marker dragging and
# the first solve after a planning-scene update are noticeably slower.
#
# The "gripper" group is a single actuated joint (the rest are URDF mimics) and
# is driven in joint space only, so it deliberately has no kinematics solver.
# ─────────────────────────────────────────────────────────────────────────────

ur5_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
