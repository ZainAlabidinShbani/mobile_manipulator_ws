# nav2_params.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 6 — Nav2 stack for the warehouse mobile manipulator.
#
# Localization : AMCL against the saved slam_toolbox map (maps/warehouse.yaml).
# Planning     : NavFn (default global planner), DWB (default local controller).
#
# Geometry the numbers below encode:
#   * Base footprint 0.99 × 0.67 m (chassis + wheels) plus the front lidar
#     puck protruding to x = +0.575 → footprint polygon [±(0.58/-0.51), ±0.35].
#     Inscribed radius 0.35 m, circumscribed ≈ 0.68 m.
#   * inflation_radius 0.75 = circumscribed radius + safety margin. The
#     jersey-barrier gate at x = 1.6 is only 0.934 m wide (0.467 m half-gap),
#     so gate cells stay below lethal cost: cost_scaling_factor 3.0 gives
#     252·exp(−3.0·(0.467−0.35)) ≈ 177 there — expensive but traversable.
#   * DWB uses the ObstacleFootprint critic (checks the true polygon against
#     LETHAL only). The default BaseObstacle critic scores the center cell,
#     which sits in inscribed-cost territory inside the gate and would veto
#     every trajectory through it.
#   * cmd_vel is remapped at launch to /diff_drive_controller/cmd_vel_unstamped
#     (use_stamped_vel: false on the controller); odometry comes from
#     /diff_drive_controller/odom. Wheel odometry over-reports under slip, so
#     AMCL rotation alphas are generous.
#   * The euro pallets (0.144 m tall) are invisible to the 0.30 m scan plane —
#     they are absent from the static map and costmaps. All Phase 6 routes
#     keep ≥ 5 m from every pallet.
# ─────────────────────────────────────────────────────────────────────────────

amcl:
  ros__parameters:
    use_sim_time: True
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Skid-steer slip → rotation odometry is the least trustworthy input.
    #
    # RAISED IN PHASE 9, and alpha4 is the one that matters.  Phase 6 only ever
    # gated a straight-line goal, so the base's worst habit never showed up:
    # an in-place turn drags four fixed wheels sideways and walks the body
    # ~0.12 m per radian, which is ~0.19 m of pure lateral displacement for the
    # 90 deg turn onto the drop-bench leg.  A DifferentialMotionModel has no
    # lateral term at all, so that motion is not merely mis-measured, it is
    # structurally unobservable to odometry — the filter has to recover it from
    # the laser or not at all.
    #
    # Measured with the old values (loc_log, AMCL vs gz ground truth, sampled
    # 2 Hz through one cycle): error was 0.18 m entering the turn, 0.44 m
    # immediately after it, and grew monotonically to 0.77 m and beyond while
    # AMCL insisted the robot was driving north and it was actually going
    # south.  Nav2 then failed to plan, ran Spin recoveries ("Collision Ahead -
    # Exiting Spin"), and each spin injected more of the same error until the
    # estimate was ~4 m out and PLACE_ARM set the object down on bare floor
    # while every log line still said success.
    #
    # alpha4 is translation noise caused by rotation — the exact term for
    # "turning moves the body in a way the wheels do not report".  Widening it
    # lets the particle cloud actually cover the true pose after a turn so the
    # likelihood field can pick it out; alpha1 widens heading spread for the
    # same reason.  Over-wide is cheap here (2000 particles, a static
    # warehouse); too narrow is what diverges.
    alpha1: 0.6
    alpha2: 0.4
    alpha3: 0.3
    alpha4: 0.6
    alpha5: 0.2
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.15
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # Robot spawns at the world origin facing +x; the map was started there,
    # so map ≈ world and bringup localizes immediately without /initialpose.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: True
    # Absolute path injected by nav2_bringup.launch.py (map launch argument)
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default NavigateToPose / NavigateThroughPoses BT XMLs are compiled in
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    # Nav2 default goal tolerance: 0.25 m / 0.25 rad — the Phase 6 gate
    # measures arrival against exactly this.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 25
      vy_samples: 1
      vtheta_samples: 25
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ObstacleFootprint (not BaseObstacle) — see header comment
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # chassis 0.99 × 0.67 m + front lidar puck to x = +0.575, small pad
      footprint: "[ [0.58, 0.35], [0.58, -0.35], [-0.51, -0.35], [-0.51, 0.35] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[ [0.58, 0.35], [0.58, -0.35], [-0.51, -0.35], [-0.51, 0.35] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
