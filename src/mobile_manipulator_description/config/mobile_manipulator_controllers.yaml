# mobile_manipulator_controllers.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 3 — full controller configuration for ros2_control_node.
#
# This single file is passed to ros2_control_node as --params-file.
# It contains BOTH the controller type declarations AND all per-controller params.
#
# Humble behaviour (important):
#   ros2_control_node reads ALL yaml keys that match its own node name
#   (controller_manager.*) BUT the controller sub-nodes are also loaded in-process
#   and CAN read their own namespace keys (diff_drive_controller.*, arm_controller.*,
#   gripper_action_controller.*) when those are pre-declared via the same --params-file.
#   diff_drive_controller reads wheel_separation during on_init() — before the spawner
#   can inject params via -p — so it MUST be in this file.
#
# arm_controller and gripper_action_controller params are duplicated here for
# reliability.  The spawner -p flag will override them if passed.
#
# Naming: no "husky" anywhere (per instructions.md).
# ─────────────────────────────────────────────────────────────────────────────

controller_manager:
  ros__parameters:
    # Gazebo physics runs at 500 Hz (warehouse.world: max_step_size 0.002) but
    # the controller manager deliberately stays at 100 Hz: raising it to 500
    # inside gzserver starves the sensor rendering thread on this 8-core box —
    # the two 640x480 wrist cameras fell from ~3 Hz to under 0.3 Hz — and it did
    # NOT stop the parked base creeping while the arm holds an extended pose
    # (see the "base creeps with the arm extended" note in CLAUDE.md), so the
    # frame rate is the better thing to spend the cycles on.
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_action_controller:
      type: position_controllers/GripperActionController


# ─── Per-controller parameters ───────────────────────────────────────────────
# These keys are loaded into the controller_manager node's parameter space.
# ros2_control_node passes them to each controller when it is loaded.

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel
      - rear_left_wheel
    right_wheel_names:
      - front_right_wheel
      - rear_right_wheel

    wheel_separation: 0.5118
    wheel_radius: 0.1651
    # Skid-steer slip compensation: rotating drags four fixed wheels sideways,
    # so the effective track differs from the geometric 0.5118 m.  This value
    # is what makes /odom's yaw match reality; get it wrong and slam_toolbox
    # diverges within one turn while reporting no errors at all.
    #
    # RE-MEASURED FOR GAZEBO FORTRESS (DART).  The previous 1.37 was fitted
    # against Gazebo Classic's ODE solver, where the effective track measured
    # 0.70 m.  DART resolves the same mu1=1.0 / mu2=0.15 wheel contact into
    # noticeably less lateral scrub, so the effective track is 0.5573 m and
    # the multiplier is 1.0889.
    #
    # Method (four in-place spins at +/-0.6 rad/s, ground truth from the gz
    # transport pose topic, never from /odom since /odom is the thing being
    # calibrated):
    #     body yaw / commanded yaw = 1.005   <- physics tracks commands
    #     odom yaw / commanded yaw = 0.799   <- odometry under-reports 20.5 %
    #     b_effective = 0.5118 * 1.37 * 0.799 / 1.005 = 0.5573 m
    # Under 1.37 that 20.5 % bias rotated the SLAM map frame 17.7 deg away
    # from the world frame over one mapping loop, which is what broke the
    # Phase 6 gate after the migration.
    #
    # Note the anisotropic wheel friction IS honoured by DART: with mu2 back
    # at 1.0 the body only achieves 0.31 of commanded yaw, so the mu2=0.15
    # patch in husky_description/urdf/wheel.urdf.xacro remains load-bearing.
    wheel_separation_multiplier: 1.0889

    use_stamped_vel: false
    publish_rate: 50.0

    # Integrate odometry from wheel velocity states (mock hardware does not
    # integrate commanded velocity into position states)
    position_feedback: false

    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.010
    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.010


arm_controller:
  ros__parameters:
    joints:
      - arm_shoulder_pan_joint
      - arm_shoulder_lift_joint
      - arm_elbow_joint
      - arm_wrist_1_joint
      - arm_wrist_2_joint
      - arm_wrist_3_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      arm_shoulder_pan_joint:
        goal: 0.01
      arm_shoulder_lift_joint:
        goal: 0.01
      arm_elbow_joint:
        goal: 0.01
      arm_wrist_1_joint:
        goal: 0.01
      arm_wrist_2_joint:
        goal: 0.01
      arm_wrist_3_joint:
        goal: 0.01


gripper_action_controller:
  ros__parameters:
    joint: gripper_robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 200.0
    # allow_stalling MUST be true for a gripper that actually grips.  Phase 9
    # closes the jaws onto a 66 mm ball with ~10 mm of interference, so the
    # knuckle stalls at ~0.18 rad against a 0.30 rad command — that is what a
    # successful grasp looks like.  With allow_stalling: false the controller
    # reports the goal ABORTED at exactly the moment the object is held, and
    # the orchestrator's GRASP state fails on every successful pick.
    # The orchestrator confirms the grasp separately, by checking that the
    # knuckle came to rest inside [0.05, 0.28] rad rather than closing to the
    # command on empty air.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
